name: Fix closing checklist initial render
on:
  push:
    paths:
      - 'scripts/fix-closing-initial-render.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python scripts/fix-closing-initial-render.py
      - name: Commit update and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/fix-closing-initial-render.py .github/workflows/fix-closing-initial-render.yml
          git commit -m "Fix closing checklist initial render"
          git push
