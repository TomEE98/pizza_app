name: Update Blasko's Pizza navigation icons

on:
  push:
    paths:
      - ICONS_READY

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<button class="nav active" data-page="today"><b>▣</b>Today</button><button class="nav" data-page="records"><b>◴</b>Records</button><button class="nav" data-page="add"><b>＋</b>Add</button><button class="nav" data-page="bookings"><b>▦</b>Bookings</button><button class="nav" data-page="stock"><b>◇</b>Stock</button><button class="nav" data-page="docs"><b>▤</b>Docs</button><button class="nav" data-page="staff"><b>♧</b>Staff</button><button class="nav" data-page="system"><b>☷</b>System</button>'''
          new='''<button class="nav active" data-page="today"><b><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="8" y="5" width="16" height="23" rx="3"/><path d="M12 5.5V4h8v1.5M11.5 12h9M11.5 17h9M11.5 22l2.5 2 5-5"/></svg></b>Today</button><button class="nav" data-page="records"><b><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 7a10 10 0 1 1-4.2 16.4"/><path d="M7 7v7h7M16 10v7l5 3"/></svg></b>Records</button><button class="nav" data-page="add"><b><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 7v18M7 16h18"/></svg></b>Add</button><button class="nav" data-page="bookings"><b><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="7" width="22" height="21" rx="3"/><path d="M10 4v6M22 4v6M5 13h22M10 18h3M16 18h3M10 23h3M16 23h3"/></svg></b>Bookings</button><button class="nav" data-page="stock"><b><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 4 10 6-10 6-10-6 10-6Z"/><path d="M6 10v12l10 6 10-6V10M16 16v12M21 18h7M24 15l4 3-4 3"/></svg></b>Stock</button><button class="nav" data-page="docs"><b><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 5h12l5 5v17H8z"/><path d="M20 5v6h5M12 16h9M12 21h9"/><path d="M5 9v18a2 2 0 0 0 2 2h14"/></svg></b>Docs</button><button class="nav" data-page="staff"><b><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="10" r="5"/><path d="M3 27c0-5 4-8 9-8s9 3 9 8M21 7a5 5 0 0 1 0 9M23 19c4 .5 6 3.2 6 7"/></svg></b>Staff</button><button class="nav" data-page="system"><b><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 9h20M6 16h20M6 23h20"/><circle cx="12" cy="9" r="2.5"/><circle cx="21" cy="16" r="2.5"/><circle cx="15" cy="23" r="2.5"/></svg></b>System</button>'''
          css_old='.nav b{display:flex;align-items:center;justify-content:center;width:30px;height:30px;font-size:25px;line-height:1;font-weight:400}'
          css_new='.nav b{display:flex;align-items:center;justify-content:center;width:30px;height:30px;font-size:25px;line-height:1;font-weight:400}.nav b svg{width:28px;height:28px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}'
          if old not in s: raise SystemExit('Expected navigation markup not found')
          if css_old not in s: raise SystemExit('Expected navigation icon CSS not found')
          s=s.replace(old,new,1).replace(css_old,css_new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit icon update
        run: |
          rm -f ICONS_READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ICONS_READY
          git commit -m "Match navigation icons to reference" || exit 0
          git push
