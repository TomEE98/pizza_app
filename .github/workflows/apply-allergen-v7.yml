name: Apply allergen matrix V7
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_allergen_matrix_v7.py'
      - '.github/workflows/apply-allergen-v7.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V7 allergen design
        run: python scripts/apply_allergen_matrix_v7.py
      - name: Commit updated app and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/apply_allergen_matrix_v7.py .github/workflows/apply-allergen-v7.yml
          git commit -m "Refine allergen matrix columns and explanations"
          git pull --rebase origin main
          git push origin HEAD:main
