name: Apply allergen matrix V6
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_allergen_matrix_v6.py'
      - 'scripts/trigger-allergen-v6'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply allergen matrix V6
        run: python scripts/apply_allergen_matrix_v6.py
      - name: Commit and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/apply_allergen_matrix_v6.py .github/workflows/apply-allergen-v6.yml scripts/trigger-allergen-v6
          git commit -m "Refine allergen matrix to match mockup"
          git push
