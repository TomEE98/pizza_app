name: Apply closing checklist
on:
  push:
    paths:
      - 'scripts/apply-closing-checklist.py'
      - '.github/workflows/apply-closing-checklist.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply closing checklist
        run: python scripts/apply-closing-checklist.py
      - name: Commit update and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/apply-closing-checklist.py .github/workflows/apply-closing-checklist.yml
          git commit -m "Replace closing checks with tick box checklist"
          git push
