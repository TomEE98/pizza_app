name: Apply allergen matrix V6
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_allergen_matrix_v6.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V6 matrix design
        run: python scripts/apply_allergen_matrix_v6.py
      - name: Commit updated app and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/apply_allergen_matrix_v6.py .github/workflows/apply-allergen-matrix-v6.yml
          git commit -m "Match allergen matrix to approved mockup"
          git push
