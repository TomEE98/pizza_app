name: Apply allergen matrix V8
on:
  push:
    paths:
      - '.github/workflows/apply-allergen-matrix-v6.yml'
      - 'scripts/v8.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V8 styling
        run: python scripts/v8.py
      - name: Commit app and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/v8.py .github/workflows/apply-v8.yml .github/workflows/apply-allergen-matrix-v6.yml
          git commit -m "Match allergen matrix to reference screenshots"
          git pull --rebase origin main
          git push origin HEAD:main
