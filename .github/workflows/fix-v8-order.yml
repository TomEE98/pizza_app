name: Fix V8 style order
on:
  push:
    paths:
      - '.github/workflows/fix-v8-order.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move V8 after V7
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.find('<style id="v8">')
          if a < 0: raise SystemExit('v8 not found')
          b=s.find('</style>',a)+8
          block=s[a:b]
          s=s[:a]+s[b:]
          v7=s.find('<style id="blaskos-allergen-design-v7">')
          if v7 < 0: raise SystemExit('v7 not found')
          end=s.find('</style>',v7)+8
          s=s[:end]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/fix-v8-order.yml
          git commit -m "Place allergen reference styling after V7 overrides"
          git pull --rebase origin main
          git push origin HEAD:main
