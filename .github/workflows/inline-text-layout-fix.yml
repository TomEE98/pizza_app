name: Fix checklist text layout

on:
  push:
    paths:
      - INLINE_TEXT_LAYOUT_READY

permissions:
  contents: write

jobs:
  fix-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put checklist descriptions below titles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.check-list .check span{font-size:15px}'
          new='.check-list .check span{font-size:15px}.check-list .check span b{display:block;margin-bottom:3px}.check-list .check span{line-height:1.45}'
          if old not in s:
              raise SystemExit('Expected checklist text CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit layout fix
        run: |
          rm -f INLINE_TEXT_LAYOUT_READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html INLINE_TEXT_LAYOUT_READY
          git commit -m "Place checklist descriptions below titles" || exit 0
          git push
