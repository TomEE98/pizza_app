name: Narrow allergen menu column
on:
  push:
    paths:
      - 'scripts/narrow-menu-column-v11.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrower column
        run: python scripts/narrow-menu-column-v11.py
      - name: Commit and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/narrow-menu-column-v11.py .github/workflows/narrow-menu-column-v11.yml
          git commit -m "Make allergen menu column narrower"
          git pull --rebase origin main
          git push origin HEAD:main
