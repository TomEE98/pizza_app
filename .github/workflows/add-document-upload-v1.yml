name: Add document upload library

on:
  workflow_dispatch:
  push:
    paths:
      - 'DOCUMENT_UPLOAD_V1_READY'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply document upload library
        run: python scripts/add-document-upload-v1.py
      - name: Commit and remove temporary updater
        run: |
          rm -f DOCUMENT_UPLOAD_V1_READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html DOCUMENT_UPLOAD_V1_READY
          git rm -f scripts/add-document-upload-v1.py .github/workflows/add-document-upload-v1.yml
          git commit -m "Add functional document upload library"
          git push
