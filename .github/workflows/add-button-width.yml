name: Adjust Blasko's Pizza Add button width

on:
  push:
    paths:
      - ADD_BUTTON_WIDTH_READY

permissions:
  contents: write

jobs:
  adjust-add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce Add button width
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.nav[data-page=add] b{width:54px;height:54px;border-radius:16px;background:var(--green);color:white;font-size:30px}'
          new='.nav[data-page=add] b{width:50px;height:54px;border-radius:16px;background:var(--green);color:white;font-size:30px}'
          if old not in s: raise SystemExit('Expected Add button CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit width adjustment
        run: |
          rm -f ADD_BUTTON_WIDTH_READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ADD_BUTTON_WIDTH_READY
          git commit -m "Slightly reduce Add button width" || exit 0
          git push
