name: Apply allergen matrix V4
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_allergen_matrix.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply allergen matrix
        run: python scripts/apply_allergen_matrix.py
      - name: Commit and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/apply_allergen_matrix.py .github/workflows/apply-allergen-v4.yml
          git commit -m "Add functional allergen matrix V4"
          git push
