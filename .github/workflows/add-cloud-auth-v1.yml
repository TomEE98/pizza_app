name: Add secure login and persistent cloud storage

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/add-cloud-auth-v1.py'
      - 'scripts/cloud-integration.js'
      - 'supabase-config.js'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate cloud integration JavaScript
        run: node --check scripts/cloud-integration.js
      - name: Apply cloud integration
        run: python scripts/add-cloud-auth-v1.py
      - name: Validate generated HTML JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          checked=0
          for i,b in enumerate(blocks):
              if not b.strip():
                  continue
              p=Path(tempfile.gettempdir())/f'blasko-script-{i}.js'
              p.write_text(b)
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'JavaScript block {i} failed syntax check')
              checked+=1
          print('Validated',checked,'inline script blocks')
          PY
      - name: Commit cloud integration and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/add-cloud-auth-v1.py scripts/cloud-integration.js .github/workflows/add-cloud-auth-v1.yml
          git commit -m "Add secure login and persistent cloud storage"
          git push
