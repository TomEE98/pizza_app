name: Apply Blasko's Pizza v11

on:
  push:
    paths:
      - V11_READY

permissions:
  contents: write

jobs:
  apply-v11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply v11 changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_nav = '<button class="nav active" data-page="today"><b>✓</b>Today</button><button class="nav" data-page="records"><b>◷</b>Records</button><button class="nav" data-page="add"><b>＋</b>Add</button><button class="nav" data-page="bookings"><b>▣</b>Bookings</button><button class="nav" data-page="docs"><b>▤</b>Docs</button><button class="nav" data-page="staff"><b>♙</b>Staff</button><button class="nav" data-page="system"><b>⚙</b>System</button>'
          new_nav = '<button class="nav active" data-page="today"><b>✓</b>Today</button><button class="nav" data-page="records"><b>◷</b>Records</button><button class="nav" data-page="add"><b>＋</b>Add</button><button class="nav" data-page="bookings"><b>▣</b>Bookings</button><button class="nav" data-page="stock"><b>▦</b>Stock</button><button class="nav" data-page="docs"><b>▤</b>Docs</button><button class="nav" data-page="staff"><b>♙</b>Staff</button><button class="nav" data-page="system"><b>⚙</b>System</button>'

          old_go = "if(id==='bookings')renderBookings();if(id==='today')renderToday();window.scrollTo"
          new_go = "if(id==='bookings')renderBookings();if(id==='today')renderToday();if(id==='stock')renderStock();window.scrollTo"

          if old_nav not in s:
              raise SystemExit('Expected v10 navigation was not found; aborting without changes.')
          if old_go not in s:
              raise SystemExit('Expected v10 go() code was not found; aborting without changes.')

          s = s.replace(old_nav, new_nav, 1)
          s = s.replace(old_go, new_go, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit v11
        run: |
          rm -f V11_READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html V11_READY
          git commit -m "Update app to v11" || exit 0
          git push
