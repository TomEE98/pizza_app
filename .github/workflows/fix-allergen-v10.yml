name: Fix allergen matrix V10
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_allergen_matrix_v10.py'
      - '.github/workflows/fix-allergen-v10.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V10 cleanup
        run: python scripts/fix_allergen_matrix_v10.py
      - name: Commit and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/fix_allergen_matrix_v10.py .github/workflows/fix-allergen-v10.yml
          git commit -m "Clean allergen matrix headers and pizza rows"
          git pull --rebase origin main
          git push origin HEAD:main
