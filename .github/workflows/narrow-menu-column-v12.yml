name: Apply narrow allergen menu column V12
on:
  push:
    paths:
      - 'scripts/narrow-menu-column-v12.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V12 narrow column
        run: python scripts/narrow-menu-column-v12.py
      - name: Commit app update and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/narrow-menu-column-v12.py .github/workflows/narrow-menu-column-v12.yml
          git commit -m "Force allergen menu column narrow"
          git pull --rebase origin main
          git push origin HEAD:main
